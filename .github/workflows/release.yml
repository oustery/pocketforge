name: Release

# Автосборка release-APK и публикация в Releases при каждом пуше в main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Извлечь версию из pubspec.yaml
        id: ver
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Проверки (pub get + analyze + test)
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Сборка release-APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Переименовать APK под тег релиза
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "pocketforge-$TAG-arm64.apk"

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PocketForge ${{ steps.ver.outputs.tag }}
          body: |
            Автоматическая сборка из `main` (коммит ${{ github.sha }}).

            - release-APK для arm64 (подписан debug-ключом — устанавливается на устройство)
            - до сборки прогнаны flutter analyze и flutter test
          draft: false
          prerelease: false
          generate_release_notes: true
          files: pocketforge-*.apk
